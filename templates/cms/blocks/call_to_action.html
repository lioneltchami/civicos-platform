{% load i18n %}
<div class="cta-block cta-block--{{ value.button_style }}">
  <h2 class="cta-block__heading">{{ value.heading }}</h2>
  {% if value.body %}
    <p class="cta-block__body">{{ value.body }}</p>
  {% endif %}
  <a href="{{ value.button_url }}" class="btn btn--{{ value.button_style }}">
    {{ value.button_text }}
  </a>
</div>
