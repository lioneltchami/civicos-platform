name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.12"

jobs:

  # ------------------------------------------------------------------
  # Lint
  # ------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install ruff
        run: pip install ruff
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .

  # ------------------------------------------------------------------
  # Security scan
  # ------------------------------------------------------------------
  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit production requirements
        run: pip-audit -r requirements/production.txt

  # ------------------------------------------------------------------
  # Test suite
  # ------------------------------------------------------------------
  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: civicos_test
          POSTGRES_USER: civicos
          POSTGRES_PASSWORD: ci_test_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements/test.txt') }}
      - name: Install dependencies
        run: pip install -r requirements/test.txt
      - name: Run migrations
        env:
          DATABASE_URL: postgres://civicos:ci_test_password@localhost:5432/civicos_test
          REDIS_URL: redis://localhost:6379/1
          DJANGO_SECRET_KEY: ci-not-for-production
          GC_NOTIFY_API_KEY: ""
          DJANGO_SETTINGS_MODULE: config.settings.test
        run: python manage.py migrate --noinput
      - name: Run tests
        env:
          DATABASE_URL: postgres://civicos:ci_test_password@localhost:5432/civicos_test
          REDIS_URL: redis://localhost:6379/1
          DJANGO_SECRET_KEY: ci-not-for-production
          GC_NOTIFY_API_KEY: ""
          DJANGO_SETTINGS_MODULE: config.settings.test
        run: python manage.py test --verbosity=2 --parallel 2>&1

  # ------------------------------------------------------------------
  # Docker build
  # ------------------------------------------------------------------
  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build production image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: production
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
