# CivicOS nginx — reverse proxy + static serving + rate limiting

upstream gunicorn {
    server web:8000;
    keepalive 32;
}

# Preserve the original client scheme when running behind a proxy or tunnel.
map $http_x_forwarded_proto $proxy_x_forwarded_proto {
    default $scheme;
    https   https;
    http    http;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=general:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=health:10m rate=600r/m;

# Bug 6 fix — GovStack Scheduler BB-to-BB calls carry `request_token` (a
# shared-secret credential) as a query-string parameter on every one of the
# 37 GovStack Scheduler endpoints. This is a query-string credential design
# decision already baked into the GovStack API contract — it is NOT being
# changed here. nginx's default `combined` access_log format logs the full
# request line ($request), which includes the query string, so without this
# custom format every GovStack Scheduler request would write its
# `request_token` to disk in plaintext. `govstack_safe` logs $uri (path only,
# no query string) instead of $request/$request_uri/$query_string, so the
# token never reaches the log file, while status, timing, and upstream
# metrics are still captured for operational visibility.
log_format govstack_safe '$remote_addr - [$time_local] '
                          '"$request_method $uri $server_protocol" '
                          '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                          'rt=$request_time uct=$upstream_connect_time '
                          'uht=$upstream_header_time urt=$upstream_response_time';

server {
    listen 80;
    server_name _;
    client_max_body_size 50m;

    # Redirect HTTP → HTTPS when load balancer sets X-Forwarded-Proto
    if ($http_x_forwarded_proto = "http") {
        return 301 https://$host$request_uri;
    }

    # Security headers
    add_header X-Content-Type-Options  "nosniff"                          always;
    add_header X-Frame-Options         "DENY"                             always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin"  always;
    add_header Permissions-Policy      "geolocation=(), microphone=()"    always;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml text/javascript;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;

    # Static files — nginx serves directly, bypasses gunicorn
    location /static/ {
        alias /app/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        access_log off;
    }

    # Media files
    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "private";
        add_header Content-Disposition "attachment";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Public API landing page for the backend domain root
    location = / {
        root /usr/share/nginx/html;
        try_files /api-root.html =404;
    }

    # Health check — high limit, no logging
    location ~ ^/health(/|$) {
        limit_req zone=health burst=60 nodelay;
        proxy_pass http://gunicorn;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        access_log off;
    }

    # API endpoints — rate limited
    location /api/ {
        limit_req zone=api burst=10 nodelay;
        proxy_pass http://gunicorn;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_read_timeout    120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        client_max_body_size  50m;
    }

    # GovStack Scheduler BB endpoints (Bug 6 fix) — must be declared before the
    # catch-all `location /` below so it takes precedence (nginx picks the
    # longest-matching prefix location, and this is a longer, more specific
    # prefix than `/`). Without this dedicated block, /govstack/scheduler/*
    # requests fall into the catch-all below, which has no custom log_format
    # and therefore inherits the default `combined`-style access_log — logging
    # the full request line, `request_token` query param included, in
    # plaintext to /var/log/nginx/access.log. Using the `govstack_safe` format
    # (defined above) here logs $uri instead, so the path is still logged for
    # operational visibility but the credential is not. This is purely an
    # infra-layer fix — request_token remains a query-string parameter per the
    # existing GovStack API contract; it is not moved to a header.
    location /govstack/ {
        access_log /var/log/nginx/govstack_access.log govstack_safe;
        limit_req zone=api burst=10 nodelay;
        proxy_pass http://gunicorn;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_read_timeout    120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        client_max_body_size  50m;
    }

    # All other requests
    location / {
        limit_req zone=general burst=30 nodelay;
        proxy_pass http://gunicorn;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_read_timeout    120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        client_max_body_size  50m;
    }
}
