# Production Docker Compose — civicos
# Usage:
#   cp .env.example .env.prod  && fill in real values
#   docker-compose -f docker-compose.prod.yml up -d
#
# Architecture:
#   nginx → gunicorn (web) → postgres + redis
#   celery worker + celery beat share db + redis
#   migrate service runs once at deploy to apply migrations + seed tasks

services:

  # ----------------------------------------------------------------
  # ClamAV — real-time antivirus daemon (Documents BB Layer 8 scan).
  # CLAMAV_REQUIRED=True in config/settings/production.py means the app
  # refuses to start without CLAMAV_HOST configured — this service is not
  # optional in production. clamav/clamav ships upstream ClamAV + freshclam;
  # first start is slow (~1-2 min) while freshclam pulls virus databases.
  # ----------------------------------------------------------------
  clamav:
    # NOTE: "1.4-stable" is NOT a tag the clamav/clamav repository publishes
    # (the published forms are 1.4, 1.4.x, stable, latest and their _base
    # variants) — `docker compose -f docker-compose.prod.yml up` failed with
    # "manifest unknown" and the service never started at all, which with
    # CLAMAV_REQUIRED=True also blocks web/migrate/worker/beat from booting.
    # Pinned to the 1.4 feature-release tag.
    image: clamav/clamav:1.4
    restart: always
    volumes:
      - clamav_data:/var/lib/clamav
    environment:
      # ⚠ COUPLED TO config/settings/base.py CIVICOS["DOCUMENT_MAX_STAFF_UPLOAD_BYTES"]
      # (50 MB). clamd's upstream StreamMaxLength default is 25M — BELOW that
      # app-level cap — so every clean 25-50 MB staff upload would be refused
      # by clamd, retried until the Celery retry budget was exhausted, and then
      # permanently quarantined as a bogus "scan failure" that no operator
      # could distinguish from a real detection.
      # 128M gives ~2.5x headroom. Raise BOTH values together if the app cap
      # ever increases; see the matching comment in base.py.
      #
      # CLAMD_CONF_<Directive> is the clamav/clamav entrypoint's documented
      # config mechanism (it rewrites the matching line in /etc/clamav/clamd.conf
      # on startup), so no clamd.conf bind mount is needed.
      CLAMD_CONF_StreamMaxLength: 128M
    healthcheck:
      test: ["CMD-SHELL", "echo PING | nc -w 3 127.0.0.1 3310 | grep -q PONG"]
      interval: 30s
      timeout: 10s
      retries: 10
      # Every consumer below gates on `condition: service_healthy`, so this
      # start_period is what actually bounds a cold deploy. freshclam has to
      # download the full virus database set before clamd opens its socket;
      # 120s was optimistic on a fresh clamav_data volume or a slow mirror.
      # Health-check failures inside start_period neither count against
      # `retries` nor mark the container unhealthy, so over-provisioning here
      # is free — it only delays the "healthy" transition on a genuinely slow
      # first boot, and never causes a false unhealthy.
      start_period: 300s
    networks:
      - civicos_net
    # Port NOT exposed to host — only web/worker (on civicos_net) need it
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # ----------------------------------------------------------------
  # Nginx — reverse proxy + static file serving
  # ----------------------------------------------------------------
  nginx:
    build:
      context: ./nginx
    restart: always
    ports:
      - "${CIVICOS_HOST_HTTP_BIND:-0.0.0.0}:${CIVICOS_HOST_HTTP_PORT:-80}:80"
    volumes:
      - static_data:/app/staticfiles:ro
      - media_data:/app/media:ro
    depends_on:
      web:
        condition: service_healthy
    networks:
      - civicos_net
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # ----------------------------------------------------------------
  # Django / Gunicorn
  # ----------------------------------------------------------------
  web:
    build:
      context: .
      target: production
    restart: always
    command: gunicorn --config gunicorn.conf.py config.wsgi:application
    env_file: .env.prod
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        # service_healthy, not service_started: a container is "started" as
        # soon as its entrypoint runs — long before freshclam has downloaded
        # the virus database and clamd has opened its socket (hence clamav's
        # 300s healthcheck start_period). Gating on service_started let gunicorn
        # begin serving citizen uploads against a clamd that could not yet
        # answer, so every scan in that window failed transiently, burned the
        # Celery retry budget, and ended in a spurious quarantine.
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health/live/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - civicos_net
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  # ----------------------------------------------------------------
  # One-shot: migrate + seed periodic tasks
  # ----------------------------------------------------------------
  migrate:
    build:
      context: .
      target: production
    restart: "no"
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py seed_periodic_tasks"
    env_file: .env.prod
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      # apps.documents.apps AppConfig.ready() enforces CLAMAV_REQUIRED at
      # startup for every manage.py invocation (not just runserver/gunicorn),
      # so even this one-shot migrate container needs CLAMAV_HOST reachable
      # or it fails before the migration runs at all.
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
    depends_on:
      db:
        condition: service_healthy
      clamav:
        # service_healthy: DocumentsConfig.ready() runs for every manage.py
        # invocation and, with CLAMAV_REQUIRED=True, refuses to start unless
        # ClamAV is configured — so this one-shot container must not race the
        # clamav cold start either. See the note on the web service above.
        condition: service_healthy
    networks:
      - civicos_net

  # ----------------------------------------------------------------
  # Celery worker
  # ----------------------------------------------------------------
  worker:
    build:
      context: .
      target: production
    restart: always
    # volunteers queue: shift reminders, expiry checks, impact snapshots (Wave 2+)
    command: celery -A config.celery worker -Q default,volunteers,documents --loglevel=info --concurrency=4
    env_file: .env.prod
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
    volumes:
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        # service_healthy: this worker consumes the `documents` queue and is
        # the process that actually streams files into clamd (scan_document).
        # See the note on the web service above.
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      disable: true
    networks:
      - civicos_net
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # ----------------------------------------------------------------
  # Celery beat scheduler
  # ----------------------------------------------------------------
  beat:
    build:
      context: .
      target: production
    restart: always
    command: >
      celery -A config.celery beat
             --loglevel=info
             --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file: .env.prod
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        # service_healthy: beat shares the same DocumentsConfig.ready()
        # CLAMAV_REQUIRED gate as web/migrate/worker. See the web service above.
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      disable: true
    networks:
      - civicos_net
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # ----------------------------------------------------------------
  # PostgreSQL
  # ----------------------------------------------------------------
  db:
    image: postgres:16-alpine
    restart: always
    env_file: .env.prod
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - civicos_net
    # Port NOT exposed to host in production
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # ----------------------------------------------------------------
  # Redis — broker + cache
  # ----------------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: always
    command: >
      redis-server
        --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env.prod}
        --maxmemory 512mb
        --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env.prod}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - civicos_net
    # Port NOT exposed to host in production
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  postgres_data:
  redis_data:
  static_data:
  media_data:
  clamav_data:

networks:
  civicos_net:
    driver: bridge
