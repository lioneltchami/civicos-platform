---
# =============================================================================
# CivicOS — Docker Compose (Development)
# =============================================================================
# Usage:
#   docker compose up           → start all services
#   docker compose up web       → start web server only
#   docker compose run --rm web python manage.py migrate
#   docker compose run --rm web python manage.py createsuperuser
#   docker compose run --rm web python manage.py shell_plus
#   docker compose logs -f worker
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL database
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: civicos
      POSTGRES_USER: civicos
      POSTGRES_PASSWORD: civicos
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civicos"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Redis — cache, session store, Celery broker
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # ClamAV — real-time antivirus daemon (Documents BB Layer 8 scan)
  # Without this service, CLAMAV_HOST below has nothing to connect to and
  # every upload gets quarantined (or, with CLAMAV_HOST unset, dev-bypassed
  # with no real scanning at all — see config/settings/base.py comments).
  # clamav/clamav ships the official upstream ClamAV daemon + freshclam.
  # First start is slow (~1-2 min) while freshclam downloads virus databases.
  # ---------------------------------------------------------------------------
  clamav:
    image: clamav/clamav:1.4-stable
    restart: unless-stopped
    volumes:
      - clamav_data:/var/lib/clamav
    ports:
      - "3310:3310"
    healthcheck:
      test: ["CMD-SHELL", "echo PING | nc -w 3 127.0.0.1 3310 | grep -q PONG"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  # ---------------------------------------------------------------------------
  # Django / Wagtail web server
  # ---------------------------------------------------------------------------
  web:
    build:
      context: .
      target: development
    restart: unless-stopped
    volumes:
      # Mount source code for live reloading
      - .:/app
      # Persist media uploads between restarts
      - media_data:/app/media
    ports:
      - "8000:8000"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DATABASE_URL: postgres://civicos:civicos@db:5432/civicos
      REDIS_URL: redis://redis:6379/0
      DJANGO_DEBUG: "True"
      DJANGO_SECRET_KEY: dev-secret-key-change-in-production
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,web"
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        condition: service_started
    command: >
      sh -c "
        python manage.py migrate --noinput &&
        python manage.py seed_periodic_tasks &&
        python manage.py runserver 0.0.0.0:8000
      "

  # ---------------------------------------------------------------------------
  # Celery worker — webhooks queue (latency-sensitive Stripe webhook tasks)
  # H9 fix: dedicated worker so annual receipt runs cannot delay webhook processing.
  # Also consumes the default queue so orphaned tasks are not abandoned.
  # ---------------------------------------------------------------------------
  worker-webhooks:
    build:
      context: .
      target: development
    restart: unless-stopped
    volumes:
      - .:/app
      - media_data:/app/media
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DATABASE_URL: postgres://civicos:civicos@db:5432/civicos
      REDIS_URL: redis://redis:6379/0
      DJANGO_SECRET_KEY: dev-secret-key-change-in-production
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        condition: service_started
    # volunteers queue: shift reminders, expiry checks, impact snapshots (Wave 2+)
    # documents queue: scan_document() (Layer 8 ClamAV scan) runs here — this
    # is the worker process that needs CLAMAV_HOST/CLAMAV_PORT above.
    command: celery -A config.celery worker -Q webhooks,default,volunteers,documents --loglevel=info --concurrency=4

  # ---------------------------------------------------------------------------
  # Celery worker — receipts queue (slow batch tasks: annual run, PDF/email)
  # H9 fix: isolated worker so a 10,000-donor annual run cannot starve webhooks.
  # Lower concurrency — receipt tasks are I/O-bound (PDF generation + SMTP).
  # ---------------------------------------------------------------------------
  worker-receipts:
    build:
      context: .
      target: development
    restart: unless-stopped
    volumes:
      - .:/app
      - media_data:/app/media
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DATABASE_URL: postgres://civicos:civicos@db:5432/civicos
      REDIS_URL: redis://redis:6379/0
      DJANGO_SECRET_KEY: dev-secret-key-change-in-production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A config.celery worker -Q receipts --loglevel=info --concurrency=2

  # ---------------------------------------------------------------------------
  # Celery Beat — periodic task scheduler
  # ---------------------------------------------------------------------------
  beat:
    build:
      context: .
      target: development
    restart: unless-stopped
    volumes:
      - .:/app
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DATABASE_URL: postgres://civicos:civicos@db:5432/civicos
      REDIS_URL: redis://redis:6379/0
      DJANGO_SECRET_KEY: dev-secret-key-change-in-production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A config.celery beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler

volumes:
  postgres_data:
  redis_data:
  media_data:
  clamav_data:
